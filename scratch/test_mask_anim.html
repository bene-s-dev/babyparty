<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kristi&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #faf8f5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .test-card {
      background: #ffffff;
      padding: 36px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .personal-letter-text {
      font-size: 1.05rem;
      font-weight: 500;
      color: #334155;
      margin-bottom: 24px;
      text-align: center;
      line-height: 1.58;
    }
    .sig-container {
      width: 520px;
      height: 95px;
      position: relative;
    }
    svg.sig-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }
    .sig-solid-alina {
      font-family: 'Kristi', cursive;
      font-size: 64px;
      font-weight: 400;
      fill: #1b3d68;
    }
    .sig-solid-connector {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      font-weight: 600;
      fill: #64748b;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sig-solid-kevin {
      font-family: 'Caveat', cursive;
      font-size: 42px;
      font-weight: 700;
      fill: #1b3d68;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }
    button {
      padding: 10px 22px;
      border-radius: 99px;
      border: none;
      background: #1b3d68;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="test-card">
    <p class="personal-letter-text" id="letterText">
      Benedikt, Du hast richtig geraten!<br>
      Danke dass du mitgemacht hast, wir freuen uns mit dir ☺️<br>
      Stay tuned für weitere Infos!
    </p>

    <div class="sig-container" id="sigContainer">
      <svg class="sig-svg" id="duoSvg" viewBox="0 0 520 95">
        <defs>
          <mask id="maskAlina">
            <rect id="maskBgAlina" x="0" y="0" width="260" height="95" fill="black" />
            <path id="pathAlinaStroke" d="
              M 42 34 C 30 28 26 38 34 46 C 42 54 28 62 46 62
              C 52 46 54 42 56 62
              C 64 42 66 62 70 62
              C 74 41 80 40 85 62
              C 92 48 98 40 93 56 C 90 62 105 60 108 59
              M 116 65 C 122 45 127 28 129 28 C 131 28 135 48 138 68 C 132 54 125 52 136 54
              C 142 36 144 28 145 28 C 146 28 145 55 146 72 C 148 64 150 63 151 63
              C 155 45 157 42 159 62 C 162 58 164 58 165 58
              C 168 45 170 42 172 62 C 176 45 180 42 182 62
              C 186 54 192 43 197 45 C 190 53 192 62 197 62 C 202 55 203 44 204 62 C 208 62 214 61 218 59
            " fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
          </mask>

          <mask id="maskKevin">
            <rect id="maskBgKevin" x="260" y="0" width="260" height="95" fill="black" />
            <path id="pathKevinStroke" d="
              M 338 31 C 324 31 324 43 333 44 C 324 45 324 57 342 57
              C 346 45 350 43 351 57 C 356 45 359 43 361 57
              C 365 43 368 42 364 57 C 368 57 372 57 374 57
              C 378 45 382 42 388 43 C 389 50 390 57 392 57
              M 404 31 L 405 58
              M 423 32 L 408 46 L 424 58
              C 426 44 429 42 424 57 C 428 57 432 57 434 57
              C 438 45 442 57 444 57 C 446 52 448 44 449 44
              C 451 45 453 57 455 57
              C 458 45 460 43 462 57 C 466 45 470 43 472 57 C 475 56 478 54 480 54
            " fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
          </mask>
        </defs>

        <g id="grpAlina" mask="url(#maskAlina)">
          <text x="120" y="65" text-anchor="middle" class="sig-solid-alina" id="sigAlinaSvg" transform="rotate(-2.2, 120, 65)">Eure Alina</text>
        </g>

        <text x="256" y="58" text-anchor="middle" class="sig-solid-connector" id="sigConnector">und</text>

        <g id="grpKevin" mask="url(#maskKevin)">
          <text x="398" y="58" text-anchor="middle" class="sig-solid-kevin" id="sigKevinSvg" transform="rotate(2.0, 398, 58)">Euer Kevin</text>
        </g>
      </svg>
    </div>

    <div class="btn-row">
      <button onclick="playAnim('de')">Play Deutsch ("Eure Alina & Euer Kevin")</button>
      <button class="secondary" onclick="playAnim('en')">Play English ("Alina & Kevin")</button>
    </div>
  </div>

  <script>
    const PATHS = {
      de: {
        alina: "M 42 34 C 30 28 26 38 34 46 C 42 54 28 62 46 62 C 52 46 54 42 56 62 C 64 42 66 62 70 62 C 74 41 80 40 85 62 C 92 48 98 40 93 56 C 90 62 105 60 108 59 M 116 65 C 122 45 127 28 129 28 C 131 28 135 48 138 68 C 132 54 125 52 136 54 C 142 36 144 28 145 28 C 146 28 145 55 146 72 C 148 64 150 63 151 63 C 155 45 157 42 159 62 C 162 58 164 58 165 58 C 168 45 170 42 172 62 C 176 45 180 42 182 62 C 186 54 192 43 197 45 C 190 53 192 62 197 62 C 202 55 203 44 204 62 C 208 62 214 61 218 59",
        kevin: "M 338 31 C 324 31 324 43 333 44 C 324 45 324 57 342 57 C 346 45 350 43 351 57 C 356 45 359 43 361 57 C 365 43 368 42 364 57 C 368 57 372 57 374 57 C 378 45 382 42 388 43 C 389 50 390 57 392 57 M 404 31 L 405 58 M 423 32 L 408 46 L 424 58 C 426 44 429 42 424 57 C 428 57 432 57 434 57 C 438 45 442 57 444 57 C 446 52 448 44 449 44 C 451 45 453 57 455 57 C 458 45 460 43 462 57 C 466 45 470 43 472 57 C 475 56 478 54 480 54"
      },
      en: {
        alina: "M 73 65 C 79 45 84 28 86 28 C 88 28 92 48 95 68 C 89 54 82 52 93 54 C 99 36 101 28 102 28 C 103 28 102 55 103 72 C 105 64 107 63 108 63 C 112 45 114 42 116 62 C 119 58 121 58 122 58 C 125 45 127 42 129 62 C 133 45 137 42 139 62 C 143 54 149 43 154 45 C 147 53 149 62 154 62 C 159 55 160 44 161 62 C 165 62 171 61 175 59",
        kevin: "M 366 31 L 367 58 M 385 32 L 370 46 L 386 58 C 388 44 391 42 386 57 C 390 57 394 57 396 57 C 400 45 404 57 406 57 C 408 52 410 44 411 44 C 413 45 415 57 417 57 C 420 45 422 43 424 57 C 428 45 432 43 434 57 C 437 56 440 54 442 54"
      }
    };

    let animId = null;

    function playAnim(lang = 'de') {
      if (animId) cancelAnimationFrame(animId);

      const alinaEl = document.getElementById('sigAlinaSvg');
      const connEl = document.getElementById('sigConnector');
      const kevinEl = document.getElementById('sigKevinSvg');
      const pathA = document.getElementById('pathAlinaStroke');
      const pathK = document.getElementById('pathKevinStroke');
      const grpA = document.getElementById('grpAlina');
      const grpK = document.getElementById('grpKevin');

      grpA.setAttribute('mask', 'url(#maskAlina)');
      grpK.setAttribute('mask', 'url(#maskKevin)');

      const isDe = (lang === 'de');
      alinaEl.textContent = isDe ? 'Eure Alina' : 'Alina';
      connEl.textContent = isDe ? 'und' : '&';
      kevinEl.textContent = isDe ? 'Euer Kevin' : 'Kevin';

      pathA.setAttribute('d', PATHS[lang].alina);
      pathK.setAttribute('d', PATHS[lang].kevin);

      const lenA = pathA.getTotalLength();
      const lenK = pathK.getTotalLength();

      pathA.style.strokeDasharray = lenA;
      pathA.style.strokeDashoffset = lenA;
      pathK.style.strokeDasharray = lenK;
      pathK.style.strokeDashoffset = lenK;
      connEl.style.opacity = '0';

      const durA = isDe ? 1450 : 1000;
      const pause = 220;
      const durK = isDe ? 1400 : 950;
      const total = durA + pause + durK;
      const start = performance.now();

      function step(now) {
        const elapsed = now - start;

        if (elapsed < durA) {
          const p = elapsed / durA;
          // Smooth handwriting easing
          const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
          pathA.style.strokeDashoffset = Math.max(0, lenA * (1 - ease));
        } else if (elapsed < durA + pause) {
          pathA.style.strokeDashoffset = '0';
          connEl.style.opacity = '1';
        } else if (elapsed < total) {
          pathA.style.strokeDashoffset = '0';
          connEl.style.opacity = '1';
          const pK = (elapsed - durA - pause) / durK;
          const easeK = pK < 0.5 ? 2 * pK * pK : -1 + (4 - 2 * pK) * pK;
          pathK.style.strokeDashoffset = Math.max(0, lenK * (1 - easeK));
        } else {
          pathA.style.strokeDashoffset = '0';
          pathK.style.strokeDashoffset = '0';
          connEl.style.opacity = '1';
          // After writing completes, remove masks to ensure pristine 100% full view
          grpA.removeAttribute('mask');
          grpK.removeAttribute('mask');
          animId = null;
          return;
        }

        animId = requestAnimationFrame(step);
      }

      animId = requestAnimationFrame(step);
    }

    setTimeout(() => playAnim('de'), 300);
  </script>
</body>
</html>
